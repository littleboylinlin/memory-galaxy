appId: com.littleboylinlin.memorygalaxy
productName: Memory Galaxy
directories:
  output: release
files:
  - desktop/*.mjs
  - desktop/preload.cjs
  - desktop/icon.ico
  - desktop/icon.png
  - web/**/*
  - protocol/**/*
  - LICENSE
win:
  target: nsis
  executableName: MemoryGalaxy
  icon: desktop/icon.ico
  artifactName: MemoryGalaxy-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
mac:
  target: dmg
  icon: desktop/icon.png
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  notarize: false
  artifactName: MemoryGalaxy-${version}-macos-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: memory-galaxy
  syncDesktopName: true
  icon: desktop/icon.png
  category: Utility
  artifactName: MemoryGalaxy-${version}-linux-${arch}.${ext}
deb:
  maintainer: 小男孩 <247175383+littleboylinlin@users.noreply.github.com>
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64 | libasound2
